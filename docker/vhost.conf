# Apache virtual host for TimeCapsule.
<VirtualHost *:80>
    # Only public/ is reachable from the web. src/, views/, storage/ and .env are not.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # Existing files (css, js, vendor) are served directly; every other URL goes to the front controller.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
