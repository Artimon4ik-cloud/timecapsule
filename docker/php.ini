; Allow uploads a bit larger than MAX_UPLOAD_MB (5 MB), so the app itself can show
; a friendly "File must be at most 5 MB." message instead of PHP silently dropping the file.
upload_max_filesize = 6M
post_max_size = 8M

; Never show errors to visitors; the app shows its own 500 page.
display_errors = Off
log_errors = On
