# Sample nginx site for TimeCapsule on an Ubuntu server with PHP-FPM 8.3.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/timecapsule
#   sudo ln -s /etc/nginx/sites-available/timecapsule /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # Only the public/ folder is reachable from the web.
    root /var/www/timecapsule/public;
    index index.php;

    # A little more than MAX_UPLOAD_MB, so the app can show its own error message.
    client_max_body_size 8M;

    # Existing files (css, js, vendor) are served by nginx; everything else goes to the front controller.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Never serve hidden files such as .env or .git.
    location ~ /\. {
        deny all;
    }
}
